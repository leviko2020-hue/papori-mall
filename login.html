<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인 — PAPORI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-top">
    <a href="index.html" class="logo">PAPOR<span>I</span></a>
    <nav class="gnb">
      <a href="category-thermal.html">열화상카메라</a>
      <a href="category-kepco.html">한전 기자재/계측기</a>
      <a href="#">고객센터</a>
    </nav>
    <div class="header-actions">
      <div class="search-box"><input type="text" placeholder="제품명, 모델명 검색"></div>
      <a href="login.html">로그인</a>
      <a href="cart.html">장바구니</a>
      <a href="quote-request.html" class="btn btn-primary btn-sm">견적요청</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <h1>로그인</h1>
  <p class="sub">일반회원 / 기업회원 모두 동일하게 로그인합니다</p>

  <form id="login-form">
    <div class="form-group">
      <label>이메일</label>
      <input type="email" id="li-email" placeholder="example@company.com">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="li-password" placeholder="비밀번호 입력">
    </div>
    <button type="button" class="btn btn-primary btn-block" id="login-submit">로그인</button>
    <p id="login-msg" style="font-size:13px; color:var(--text-mute); margin-top:10px; text-align:center;"></p>
  </form>

  <div class="auth-links">
    아직 회원이 아니신가요? <a href="signup.html">회원가입</a>
  </div>
  <a href="quote-request.html" class="guest-order-link">비회원 주문조회 / 비회원으로 견적요청 하기 →</a>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-links">
      <a href="#">이용약관</a>
      <a href="#">개인정보처리방침</a>
      <a href="#">제품 자료실</a>
    </div>
    <div class="footer-info">
      <div>상호명 SEGlobal · 대표전화 042-349-0703 · 고객센터 010-8699-8868</div>
      <div>사업자등록번호 146-88-01550 · 통신판매업신고 제2206-대전대덕-0357호</div>
      <div>© PAPORI. All rights reserved.</div>
    </div>
  </div>
</footer>

<script type="module">
  import { paporiLogin } from "./papori-firebase.js";
  const msg = document.getElementById('login-msg');
  document.getElementById('login-submit').addEventListener('click', async () => {
    const email = document.getElementById('li-email').value.trim();
    const password = document.getElementById('li-password').value;
    if (!email || !password) { msg.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
    msg.textContent = '로그인 중...';
    try {
      await paporiLogin({ email, password });
      msg.textContent = '로그인되었습니다.';
      setTimeout(() => location.href = 'index.html', 800);
    } catch (err) {
      msg.textContent = '로그인 실패: ' + (err.message || err);
    }
  });
</script>

</body>
</html>
